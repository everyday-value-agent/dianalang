[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dianalang"
version = "0.1.0"
description = "A tiny declarative language for voice-assistant skills where safety is a language feature."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thanukamax" }]
keywords = ["dsl", "compiler", "voice-assistant", "security", "intent-routing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Compilers",
]
dependencies = []                      # stdlib-only, by design

[project.scripts]
dianac = "dianalang.cli:main"

[project.urls]
Homepage = "https://github.com/Thanukamax/dianalang"

[tool.hatch.build.targets.wheel]
packages = ["dianalang"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
